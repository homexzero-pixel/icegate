<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICEGATE Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>ICEGATE dashboard</h1>
      <span id="source" class="badge" hidden></span>
    </div>
    <div class="controls">
      <div class="seg" role="radiogroup" aria-label="Date range">
        <button role="radio" data-days="7">7 days</button>
        <button role="radio" data-days="30">30 days</button>
        <button role="radio" data-days="90">90 days</button>
      </div>
      <button id="refresh" class="ghost" title="Refresh">Refresh</button>
    </div>
  </header>

  <main>
    <p id="notice" class="notice" hidden></p>
    <p id="updated" class="muted small"></p>

    <section class="kpis" id="kpis" aria-label="Key figures"></section>

    <section class="card">
      <div class="card-head">
        <h2>Daily filings</h2>
        <div class="legend" id="filings-legend"></div>
      </div>
      <div class="chart" id="filings-chart"></div>
      <details class="table-view">
        <summary>View as table</summary>
        <div id="filings-table"></div>
      </details>
    </section>

    <div class="grid2">
      <section class="card">
        <div class="card-head"><h2>IGST refund pipeline</h2></div>
        <div id="refunds"></div>
      </section>
      <section class="card">
        <div class="card-head">
          <h2>Filings by port</h2>
          <div class="legend" id="ports-legend"></div>
        </div>
        <div id="ports"></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>Documents</h2>
        <div class="filters">
          <select id="f-type" aria-label="Document type">
            <option value="">All types</option>
            <option>Shipping Bill</option>
            <option>Bill of Entry</option>
          </select>
          <select id="f-status" aria-label="Status"><option value="">All statuses</option></select>
          <input id="f-q" type="search" placeholder="Search number or port" aria-label="Search">
        </div>
      </div>
      <div class="table-wrap">
        <table class="docs">
          <thead>
            <tr><th>Type</th><th>Number</th><th>Date</th><th>Port</th><th>Status</th><th class="num">Value</th><th class="num">Duty / IGST refund</th></tr>
          </thead>
          <tbody id="docs"></tbody>
        </table>
      </div>
      <div class="docs-foot"><p class="muted small" id="docs-count"></p><button id="more" class="ghost" hidden>Show 25 more</button></div>
    </section>
  </main>

  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
